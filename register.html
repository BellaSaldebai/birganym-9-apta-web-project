<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тіркелу - Веб Жоба</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header>
       
        <nav>
            <a href="index.html">Басты бет</a>
            <a href="register.html">Тіркелу</a>
            <a href="dashboard.html">Кабинет</a>
        </nav>
    </header>

    <div class="container">
        <h1>Жаңа аккаунт құру</h1>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="username">Аты-жөні:</label>
                <input type="text" id="username" placeholder="Атыңызды енгізіңіз" required>
            </div>
            <div class="form-group">
                <label for="email">Электрондық почта:</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Құпиясөз:</label>
                <input type="password" id="password" placeholder="Құпиясөздегі қауіпсіздік" required>
            </div>
            <button type="submit" class="btn">Тіркелу</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 Барлық құқықтар қорғалған.</p>
    </footer>

</body>
</html>
